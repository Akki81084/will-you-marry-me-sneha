<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Marry Me? ❤️</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            overflow:hidden;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffd3a5);
            position:relative;
        }

        .container{
            text-align:center;
            z-index:2;
        }

        h1{
            color:white;
            font-size:55px;
            margin-bottom:40px;
            text-shadow:2px 2px 10px rgba(0,0,0,0.3);
        }

        button{
            padding:15px 35px;
            font-size:22px;
            border:none;
            border-radius:50px;
            cursor:pointer;
            transition:0.3s;
        }

        #yesBtn{
            background:#ff3366;
            color:white;
            margin-right:20px;
        }

        #yesBtn:hover{
            transform:scale(1.1);
        }

        #noBtn{
            background:white;
            color:#ff3366;
            position:absolute;
        }

        #message{
            display:none;
            color:white;
            font-size:35px;
            margin-top:30px;
            animation:show 1s ease;
        }

        @keyframes show{
            from{
                opacity:0;
                transform:scale(0.5);
            }
            to{
                opacity:1;
                transform:scale(1);
            }
        }

        .heart{
            position:absolute;
            color:red;
            animation:float 5s linear infinite;
            font-size:30px;
        }

        @keyframes float{
            from{
                transform:translateY(100vh);
                opacity:1;
            }
            to{
                transform:translateY(-100px);
                opacity:0;
            }
        }

        .emoji{
            font-size:70px;
            animation:beat 1s infinite;
        }

        @keyframes beat{
            0%{transform:scale(1);}
            50%{transform:scale(1.2);}
            100%{transform:scale(1);}
        }

    </style>
</head>

<body>

    <div class="container">

        <h1 id="title">💖 Will You Marry Me? 💖</h1>

        <button id="yesBtn">Yes ❤️</button>
        <button id="noBtn">No 😢</button>

        <div id="message">
            <div class="emoji">💍❤️</div>
            <br>
            You Said YES! 🥰
            <br><br>
            You made me the happiest person alive.
            <br>
            I promise to love you,
            support you,
            and stay with you forever. ✨💕
        </div>

    </div>

    <!-- Add your own MP3 file here -->
    <audio id="loveSong">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>

        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");
        const message = document.getElementById("message");
        const title = document.getElementById("title");
        const song = document.getElementById("loveSong");

        // Move No button
        function moveButton(){
            let x = Math.random() * (window.innerWidth - 150);
            let y = Math.random() * (window.innerHeight - 80);

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        noBtn.addEventListener("mouseover", moveButton);
        noBtn.addEventListener("click", moveButton);

        // Yes button
        yesBtn.addEventListener("click", function(){

            song.play();

            title.innerHTML = "🎉 Yaaaay! 🎉";

            yesBtn.style.display = "none";
            noBtn.style.display = "none";

            message.style.display = "block";

            createHearts();
        });

        // Floating hearts
        function createHearts(){

            setInterval(function(){

                let heart = document.createElement("div");

                heart.classList.add("heart");
                heart.innerHTML = "❤️";

                heart.style.left = Math.random() * window.innerWidth + "px";
                heart.style.fontSize = (20 + Math.random()*30) + "px";

                 document.body.appendChild(heart);

                setTimeout(function(){
                    heart.remove();
                },5000);

            },250);
        }

    </script>

</body>
</html>
